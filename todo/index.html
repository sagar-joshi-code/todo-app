<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Todo List</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 550px;
      padding: 30px;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Header Section */
    .header {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 20px;
    }

    .header h1 {
      color: #333;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #888;
      font-size: 14px;
    }

    /* Input Section */
    .input-section {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    #todoInput {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    #todoInput:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    #todoInput::placeholder {
      color: #999;
    }

    #addBtn {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    #addBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    #addBtn:active {
      transform: translateY(0);
    }

    /* Stats Section */
    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
      font-size: 14px;
      color: #666;
    }

    .stats span {
      font-weight: 600;
      color: #333;
    }

    /* Todo List */
    .todo-list {
      list-style: none;
      margin-bottom: 20px;
      max-height: 400px;
      overflow-y: auto;
    }

    .todo-list::-webkit-scrollbar {
      width: 6px;
    }

    .todo-list::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }

    .todo-list::-webkit-scrollbar-thumb {
      background: #667eea;
      border-radius: 10px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      padding: 15px;
      background: #f8f9fa;
      margin-bottom: 10px;
      border-radius: 8px;
      transition: all 0.3s ease;
      border-left: 4px solid #667eea;
    }

    .todo-item:hover {
      background: #f0f0f0;
      transform: translateX(5px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    /* Checkbox */
    .todo-checkbox {
      width: 20px;
      height: 20px;
      margin-right: 12px;
      cursor: pointer;
      accent-color: #667eea;
    }

    /* Todo Text */
    .todo-text {
      flex: 1;
      color: #333;
      font-size: 16px;
      word-break: break-word;
      transition: all 0.3s ease;
    }

    .todo-item.completed .todo-text {
      color: #999;
      text-decoration: line-through;
    }

    /* Delete Button */
    .delete-btn {
      background-color: #ff6b6b;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
      margin-left: 10px;
      white-space: nowrap;
    }

    .delete-btn:hover {
      background-color: #ff5252;
      transform: scale(1.05);
    }

    .delete-btn:active {
      transform: scale(0.95);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
      font-size: 18px;
      display: none;
    }

    .empty-state.show {
      display: block;
    }

    /* Clear Button */
    .clear-btn {
      width: 100%;
      padding: 12px;
      background-color: #ffa500;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .clear-btn:hover {
      background-color: #ff8c00;
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(255, 165, 0, 0.3);
    }

    .clear-btn:active {
      transform: translateY(0);
    }

    /* Responsive Design */
    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }

      .header h1 {
        font-size: 24px;
      }

      .input-section {
        flex-direction: column;
      }

      #addBtn {
        width: 100%;
      }

      .stats {
        flex-direction: column;
        gap: 10px;
      }

      .todo-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .delete-btn {
        margin-left: 0;
        margin-top: 10px;
        width: 100%;
      }
    }
  </style>

  <body>
    <div class="container">
      <div class="header">
        <h1>📝 My Todo List</h1>
        <p class="subtitle">Keep track of your tasks</p>
      </div>

      <div class="input-section">
        <input
          type="text"
          id="todoInput"
          placeholder="Add a new task..."
          autocomplete="off"
        />
        <button id="addBtn">Add Task</button>
      </div>

      <div class="stats">
        <span id="totalTodos">Total: 0</span>
        <span id="completedTodos">Completed: 0</span>
      </div>

      <ul id="todoList" class="todo-list">
        <!-- Todos will appear here -->
      </ul>

      <div class="empty-state" id="emptyState">
        <p>🎉 No todos yet! Add one to get started.</p>
      </div>

      <button id="clearBtn" class="clear-btn">Clear Completed</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
